[package]
name = "server"
version = "0.1.0"
edition = "2024"

[lib]
name = "utils"

[[bin]]
name = "server"
path = "src/server.rs"

[dependencies]
api_kernel = { path = "../api_kernel" }
libc = "0.2.175"
serde_json = "1.0"
warp = "0.3"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rand = "0.8"