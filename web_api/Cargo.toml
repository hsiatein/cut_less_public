[workspace]
members = ["api_kernel","server"]

[package]
name = "cl_web_api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server_v1"
path = "src/bin/server_v1.rs"

[[bin]]
name = "server_v2"
path = "src/bin/server_v2.rs"

[[bin]]
name = "server_v3"
path = "src/bin/server_v3.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "transformer"
path = "src/bin/transformer.rs"

[[bin]]
name = "transformer_v4"
path = "src/bin/transformer_v4.rs"

[dependencies]
api_kernel = {path = "./api_kernel"}
warp = "0.4.2"
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"] }
openssl = { version = "0.10.75", features = ["vendored"] }
libc = "0.2.178"
decimal = "2.0"
ord_subset = "3.1.2"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
strip = true