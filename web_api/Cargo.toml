[package]
name = "cl_web_api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server_v1"
path = "src/server_v1.rs"

[[bin]]
name = "server_v2"
path = "src/server_v2.rs"

[[bin]]
name = "client"
path = "src/client.rs"

[dependencies]
warp = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }