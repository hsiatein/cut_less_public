name: cut_less
run-name: mugi
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    container:
      image: alpine_base:latest
    env:
      http_proxy: http://192.168.2.63:7897
      https_proxy: http://192.168.2.63:7897
    steps:
      - name: Checkout
        uses: http://git.lovemugi.cloud/mugi/checkout@v4
      - run: cp ./docker/Cmago.toml ./Cmago.toml -f
      - run: cmago update
      - run: rm -rf ./build/*
      - name: Build Rust server
        working-directory: ./web_api
        run: cargo build --release

          
          